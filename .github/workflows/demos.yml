# The demos: Order Desk, a small WPF app, and the suites that drive it. Demos-ReadyToRun has everything to watch them
# on any Windows computer, without .NET installed. Then the Order Desk tests, the warehouse tests and the showcase must
# pass, each failure example must fail with the message it is there to show, and validate must find every mistake in
# script-mistakes.
#
# To rebuild the bundle by hand: Actions > Demos > Run workflow, pick the branch, and untick the check to only build it.
name: Demos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: Run the demos and check each ends as it should (untick to only build the bundle)
        type: boolean
        default: true

jobs:
  demos:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Make the demo bundle
        run: |
          $bundle = "$env:RUNNER_TEMP\demos"
          dotnet publish src/AutoTestRunner.Cli -c Release -r win-x64 --self-contained -o "$bundle\autotestrunner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish samples/OrderDesk -c Release -r win-x64 --self-contained -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o "$bundle\OrderDesk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in 'order-desk-tests', 'order-desk-warehouse-tests', 'order-desk-failure-examples', 'script-mistakes', 'order-desk-showcase') {
            Copy-Item "samples\$suite" "$bundle\$suite" -Recurse
          }
          Copy-Item samples\README.md "$bundle\README.md"
          Set-Content "$bundle\0 Open the test launcher.cmd" '@"%~dp0autotestrunner\autotest.exe" launch %*'
          Set-Content "$bundle\1 Run the Order Desk tests.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-tests" %*'
          Set-Content "$bundle\2 Step through the Order Desk tests.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-tests" --mode step-by-step %*'
          Set-Content "$bundle\3 Watch tests fail.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-failure-examples" --mode pause-at-checkpoints %*'
          Set-Content "$bundle\4 Find the mistakes in a suite.cmd" "@`"%~dp0autotestrunner\autotest.exe`" validate `"%~dp0script-mistakes`"`r`n@pause"
          Set-Content "$bundle\5 Do the Order Desk tests yourself.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-tests" --speed Manual %*'
          Set-Content "$bundle\6 Run the warehouse tests.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-warehouse-tests" %*'
          Set-Content "$bundle\7 Watch the showcase.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-showcase" %*'
          Set-Content "$bundle\8 Do the showcase yourself.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-showcase" --speed Manual %*'

      - uses: actions/upload-artifact@v4
        with:
          name: Demos-ReadyToRun
          path: ${{ runner.temp }}/demos/
          retention-days: 90

      - name: Use a 1600x900 screen
        if: github.event_name != 'workflow_dispatch' || inputs.check
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1600 -Height 900 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "The screen is now $([Windows.Forms.Screen]::PrimaryScreen.Bounds.Size)"

      # The warehouse tests and the showcase's warehouse part need a RabbitMQ on the computer, with its guest user, as a
      # tester's computer would have.
      - name: Install RabbitMQ
        if: github.event_name != 'workflow_dispatch' || inputs.check
        timeout-minutes: 10
        run: |
          choco install rabbitmq -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($try in 1..30) {
            if ((Test-NetConnection localhost -Port 5672 -WarningAction SilentlyContinue).TcpTestSucceeded) { "RabbitMQ is answering"; exit 0 }
            Start-Sleep -Seconds 5
          }
          throw "RabbitMQ didn't start answering on port 5672."

      - name: Run the demos and check how each ends
        if: github.event_name != 'workflow_dispatch' || inputs.check
        timeout-minutes: 20
        run: ./tools/Run-Demos.ps1 -Bundle "$env:RUNNER_TEMP\demos" -Results artifacts/demo-results

      # Builds a case in Order Desk with clicks and keys sent to the screen, as a person would, then runs it; changes
      # case 1, adds a C# script step to a case, and makes a new suite from the launcher.
      - name: Build a case with the builder
        if: github.event_name != 'workflow_dispatch' || inputs.check
        timeout-minutes: 12
        shell: powershell
        run: ./tools/Try-Builder.ps1 -Bundle "$env:RUNNER_TEMP\demos" -Results artifacts/demo-results/builder

      # Anything that went wrong in autotest itself, with where it happened.
      - name: Show autotest's errors.log
        if: failure()
        run: Get-Content "$env:LOCALAPPDATA\AutoTestRunner\logs\errors.log" -ErrorAction SilentlyContinue

      # On the run's Summary page, which demos ended as they should, and what went wrong with any that didn't.
      - name: Show how each demo ended
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.check)
        run: |
          $report = Get-Content artifacts/demo-results/demos.txt -Raw -ErrorAction SilentlyContinue
          if (-not $report) { $report = "The demos didn't finish. The step before has the log." }
          $fence = '```'
          "$fence`n$report`n$fence" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.check)
        with:
          name: Demos-Results
          path: artifacts/demo-results/
