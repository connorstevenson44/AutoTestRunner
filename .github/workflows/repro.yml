# TEMPORARY: reproduces the new suite and script step crashes. Removed before the PR.
name: Repro
on:
  push:
    branches: [claude/project-thread-ea6ina]
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Make the demo bundle
        run: |
          $bundle = "$env:RUNNER_TEMP\demos"
          dotnet publish src/AutoTestRunner.Cli -c Release -r win-x64 --self-contained -o "$bundle\autotestrunner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish samples/OrderDesk -c Release -r win-x64 --self-contained -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o "$bundle\OrderDesk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in 'order-desk-tests', 'order-desk-failure-examples', 'script-mistakes') {
            Copy-Item "samples\$suite" "$bundle\$suite" -Recurse
          }
      - name: Use a 1600x900 screen
        continue-on-error: true
        run: Set-DisplayResolution -Width 1600 -Height 900 -Force
      - name: Try it
        timeout-minutes: 15
        shell: powershell
        run: ./tools/Try-Builder.ps1 -Bundle "$env:RUNNER_TEMP\demos" -Results artifacts/repro -Parts script, new-suite
      - name: errors.log
        if: always()
        run: Get-Content "$env:LOCALAPPDATA\AutoTestRunner\errors.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro
          path: artifacts/repro/
