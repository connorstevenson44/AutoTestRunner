name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The engine and its tests run anywhere; walk and the FlaUI driver build on Linux too, but only run on Windows.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish walk
        run: dotnet publish src/Walkthrough.Cli --configuration Release --output artifacts/walk

      - name: Check the sample suite
        run: artifacts/walk/walk.exe check samples/demo

      # Plays a made-up run in the launcher and the panel, and saves a picture of each state: it shows the windows
      # open and draw without an error, and what they look like, in the screenshots artifact.
      - name: Take pictures of the windows
        timeout-minutes: 5
        run: |
          artifacts/walk/walk.exe preview --shots artifacts/shots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shots = @(Get-ChildItem artifacts/shots -Filter *.png)
          "$($shots.Count) pictures: $($shots.Name -join ', ')"
          if ($shots.Count -lt 8) { throw "walk preview saved $($shots.Count) of 8 pictures." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/shots/

      - uses: actions/upload-artifact@v4
        with:
          name: walk
          path: artifacts/walk/
