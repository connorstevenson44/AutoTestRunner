name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The engine and its tests run anywhere; autotest and the FlaUI driver build on Linux too, but only run on Windows.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish autotest.exe
        run: dotnet publish src/AutoTestRunner.Cli --configuration Release --output artifacts/autotest

      - name: Validate the sample suite
        run: artifacts/autotest/autotest.exe validate samples/demo

      # Plays a made-up run in the launcher and the panel, and saves a picture of each state: it shows the windows
      # open and draw without an error, and what they look like, in the screenshots artifact.
      - name: Take pictures of the windows
        timeout-minutes: 5
        run: |
          artifacts/autotest/autotest.exe preview-ui --shots artifacts/shots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shots = @(Get-ChildItem artifacts/shots -Filter *.png)
          "$($shots.Count) pictures: $($shots.Name -join ', ')"
          if ($shots.Count -lt 8) { throw "autotest preview-ui saved $($shots.Count) of 8 pictures." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/shots/

      - uses: actions/upload-artifact@v4
        with:
          name: autotest
          path: artifacts/autotest/

  # The demos: Order Desk, a small WPF app, and suites that drive it. The feature tour must pass, each failure example
  # must fail with the message it is there to show, and validate must find every mistake in script-mistakes. The
  # Demos-ReadyToRun artifact has everything to watch them on any Windows computer, without .NET installed.
  demos:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Make the demo bundle
        run: |
          $bundle = "$env:RUNNER_TEMP\demos"
          dotnet publish src/AutoTestRunner.Cli -c Release -r win-x64 --self-contained -o "$bundle\autotestrunner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish samples/order-desk-app -c Release -r win-x64 --self-contained -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o "$bundle\order-desk-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in 'order-desk-feature-tour', 'order-desk-failure-examples', 'script-mistakes') {
            Copy-Item "samples\$suite" "$bundle\$suite" -Recurse
          }
          Copy-Item samples\README.md "$bundle\README.md"
          Set-Content "$bundle\1 Watch the feature tour.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-feature-tour" %*'
          Set-Content "$bundle\2 Step through the feature tour.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-feature-tour" --mode step-by-step %*'
          Set-Content "$bundle\3 Watch tests fail.cmd" '@"%~dp0autotestrunner\autotest.exe" launch "%~dp0order-desk-failure-examples" --mode pause-at-checkpoints %*'
          Set-Content "$bundle\4 Find the mistakes in a suite.cmd" "@`"%~dp0autotestrunner\autotest.exe`" validate `"%~dp0script-mistakes`"`r`n@pause"

      - uses: actions/upload-artifact@v4
        with:
          name: Demos-ReadyToRun
          path: ${{ runner.temp }}/demos/

      - name: Use a 1600x900 screen
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1600 -Height 900 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "The screen is now $([Windows.Forms.Screen]::PrimaryScreen.Bounds.Size)"

      - name: Run the demos and check how each ends
        timeout-minutes: 20
        run: |
          ./tools/Run-Demos.ps1 -Bundle "$env:RUNNER_TEMP\demos" -Results artifacts/demo-results
          $report = Get-Content artifacts/demo-results/demos.txt -Raw -ErrorAction SilentlyContinue
          $fence = '```'
          if ($report) { "$fence`n$report`n$fence" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Demos-Results
          path: artifacts/demo-results/
